jobs:
  build-android:
    name: Build Android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          # platform-tools is usually enough, setup-android v4 handles basic SDKs
          packages: platform-tools
          # We need NDK 27.2.12479018
          ndk: "27.2.12479018"

      - name: Resolve NDK path & Install cargo-ndk
        run: |
          # The setup-android action sets ANDROID_NDK_ROOT, we echo it to GITHUB_ENV for cargo-ndk
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          cargo install cargo-ndk

      - name: Build Rust library for Android
        env:
          RUST_FONTCONFIG_DLOPEN: "on"
          # ANDROID_NDK_HOME is now set by the previous step via $GITHUB_ENV
        run: |
          PROFILE_FLAG=""
          if [ "${{ inputs.build_profile }}" = "release" ]; then
            PROFILE_FLAG="--release"
          fi

          cargo ndk -t arm64-v8a \
            -o crates/typforge/android/gradle/app/src/main/jniLibs \
            build -p typforge --lib $PROFILE_FLAG

      - name: Build Android APK
        working-directory: crates/typforge/android/gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: typforge-android-debug-apk
          path: crates/typforge/android/gradle/app/build/outputs/apk/debug/*.apk
