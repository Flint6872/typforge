name: Mobile Test Build (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Cargo build profile"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Android Build (cargo-ndk + Gradle APK)
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android Build (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Resolve NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rust shared library via cargo-ndk
        run: |
          PROFILE_FLAG=""
          if [ "${{ inputs.build_profile }}" = "release" ]; then
            PROFILE_FLAG="--release"
          fi

          cargo ndk \
            -t arm64-v8a \
            -P 26 \
            -o crates/typforge/android/gradle/app/src/main/jniLibs \
            build -p typforge --lib $PROFILE_FLAG

      - name: Assemble debug APK
        working-directory: crates/typforge/android/gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: typforge-android-apk
          path: crates/typforge/android/gradle/app/build/outputs/apk/debug/*.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS Build (Rust staticlib + Xcode build)
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: iOS Build (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust static library for iOS
        run: |
          PROFILE_FLAG=""
          if [ "${{ inputs.build_profile }}" = "release" ]; then
            PROFILE_FLAG="--release"
          fi

          cargo build -p typforge --lib --target aarch64-apple-ios $PROFILE_FLAG

      - name: Generate Xcode project
        working-directory: crates/typforge/ios
        run: xcodegen generate

      - name: Build iOS App (Unsigned)
        working-directory: crates/typforge/ios
        run: |
          CONFIG="Release"
          if [ "${{ inputs.build_profile }}" = "debug" ]; then
            CONFIG="Debug"
          fi

          # Ensure cargo is in PATH for Xcode's pre-build script phase
          export PATH="$HOME/.cargo/bin:$PATH"

          xcodebuild \
            -project typforge.xcodeproj \
            -scheme typforge \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: typforge-ios-app
          path: crates/typforge/ios/build/Build/Products/*-iphoneos/*.app
