name: Release Automation

on:
  push:
    tags:
      - "v*" # Triggers automatically when you push a tag like v1.0.0

# --- Opt-in to Node 24 globally to silence deprecation warnings ---
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: typforge-linux-x86_64.tar.gz
            binary_name: typforge
          # Assuming you want aarch64 on latest Ubuntu ARM runner if 22.04 ARM isn't available/preferred
          - os: ubuntu-24.04-arm # Native ARM64 runner avoids cross-compilation headaches
            target: aarch64-unknown-linux-gnu
            archive_name: typforge-linux-aarch64.tar.gz
            binary_name: typforge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: typforge-windows.zip
            binary_name: typforge.exe
          - os: macos-14
            target: universal-apple-darwin
            archive_name: typforge-macos.dmg
            binary_name: typforge

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Installs both targets on macOS, otherwise installs the native matrix target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin x86_64-apple-darwin' || matrix.target }}

      # Speeds up subsequent compilation tasks
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Install standard native dependencies ONLY on Linux runners
      - name: Install dependencies (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
                linux-headers-generic \
                libgtk-3-dev \
                libxcb-shape0-dev \
                libxcb-xfixes0-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev \
                libwayland-dev \
                libfuse2 \
                pkg-config \
                libssl-dev \
                libfontconfig1-dev \
                libfreetype6-dev \
                fontconfig \
                libzstd-dev \
                libbz2-dev
        env:
          RUST_FONTCONFIG_DLOPEN: "on"

      # Compiles targets properly
      - name: Build Release Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            # 1. Compile both segments sequentially
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin

            # 2. Stitch them into a fat universal binary inside our target directory
            mkdir -p target/universal-apple-darwin/release
            lipo -create \
              target/aarch64-apple-darwin/release/typforge \
              target/x86_64-apple-darwin/release/typforge \
              -output target/universal-apple-darwin/release/typforge
          elif [[ "${{ matrix.os }}" == ubuntu* ]]; then
            # Standard GNU build for Linux (both architectures)
            cargo build --release --target ${{ matrix.target }}
          else
            # Standard execution path for Windows
            cargo build --release --target ${{ matrix.target }}
          fi

      # Packages and structures payload properly
      - name: Package Directory and Compress
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then
          # Extract version from GITHUB_REF_NAME (e.g., v0.0.3 -> 0.0.3)
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')

            # --- macOS DMG packaging ---
            # 1. Assemble standard macOS .app bundle skeleton structure
            mkdir -p TypstNote.app/Contents/MacOS
            mkdir -p TypstNote.app/Contents/Resources

            # 2. Copy binary and configuration items to Resources/
            cp target/universal-apple-darwin/release/typforge TypstNote.app/Contents/MacOS/
            cp -r themes TypstNote.app/Contents/Resources/ || true
            cp -r documents TypstNote.app/Contents/Resources/ || true

            # 3. Create plist metadata
            cat <<EOF > TypstNote.app/Contents/Info.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleExecutable</key>
                <string>typforge</string>
                <key>CFBundleIdentifier</key>
                <string>com.typforge.app</string>
                <key>CFBundleName</key>
                <string>TypstNote</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0.0</string>
            </dict>
            </plist>
            EOF

            # 4. Prepare temporary DMG staging directory with an Applications folder symlink
            mkdir dmg-staging
            mv TypstNote.app dmg-staging/
            ln -s /Applications dmg-staging/Applications

            # 5. Build native macOS HFS+ DMG using hdiutil
            hdiutil create -fs HFS+ -srcfolder dmg-staging -volname "TypstNote" ${{ matrix.archive_name }}
          else
            # --- Windows & Linux packaging ---
            mkdir typforge-payload
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} typforge-payload/
            cp -r themes typforge-payload/ || true
            cp -r documents typforge-payload/ || true

            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              powershell -Command "Compress-Archive -Path typforge-payload/* -DestinationPath ${{ matrix.archive_name }}"
            elif [[ "${{ matrix.os }}" == ubuntu* ]]; then
              tar -czf ${{ matrix.archive_name }} -C typforge-payload .
            fi
          fi

      # Official, Node 24-ready script automation to manage the release artifacts safely
      - name: Publish Artifacts to GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.archive_name }}';

            // Get release by tag
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
            } catch (e) {
              // Create release if it doesn't exist yet
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: false,
                prerelease: false,
              });
            }

            // Upload the asset
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: path,
              data: fs.readFileSync(path),
            });
