[package]
name = "typastry" #typASTry
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["intel", "format", "spellcheck"]
intel = ["dep:typst-ide", "dep:typst-layout"]
format = ["dep:typstyle-core"]
spellcheck = ["dep:spellbook", "dep:harper-core"]

[dependencies]
typst.workspace = true
typst-syntax.workspace = true
serde.workspace = true

# Optional dependencies mapped to features
typst-ide = { version = "0.15", optional = true }
typst-kit = { version="0.15", features=["system-packages"]}
typst-layout = { version = "0.15", optional = true }
typstyle-core = { version = "0.15", optional = true }

tree-sitter.workspace = true
tree-sitter-typst.workspace = true
tree-sitter-bibtex.workspace = true

#spellcheck
spellbook = { version = "0.4", optional = true }
harper-core = { version = "3.2", optional = true } # pin to your target version

[build-dependencies]
cc = "1.0"
