[package]
name = "typastry #typASTry
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["intel", "format"]
intel = ["dep:typst-ide", "dep:typst-layout"]
format = ["dep:typstyle-core"]

[dependencies]
typst.workspace = true
typst-syntax.workspace = true
serde.workspace = true

# Optional dependencies mapped to features
typst-ide = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
typstyle-core = { version = "0.15", optional = true }
