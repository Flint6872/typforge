[workspace.package]
version = "0.0.5"
authors = ["Flint <flint6872@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "2"

members = [
    "crates/typforge",      #main binary
    "crates/typsdocx",      #typst document to MS word export
    "crates/typst-gpui",    #renderer for typst to gpui
    "crates/typastry",      #holds the AST info
]


[workspace.dependencies]
gpui-kit = { version = "0.8", features = ["tree-sitter"] }

tree-sitter = "0.26.13"
tree-sitter-typst = { git = "https://github.com/SeniorMars/tree-sitter-typst" }
tree-sitter-bibtex = {git = "https://github.com/latex-lsp/tree-sitter-bibtex"}

typst = "0.15"
typst-syntax = "0.15"
typst-layout = "0.15"
chrono = "0.4.44"

tower-lsp = "0.20"
lsp-types = "0.97.0"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12.5"

serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Keep dependencies fast even in debug mode
[profile.dev.package."*"]
opt-level = 3
